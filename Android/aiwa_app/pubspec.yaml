name: aiwa_app
description: AIWA - Beauty & Grooming Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network
  dio: ^5.4.3+1

  # Dependency injection
  get_it: ^7.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Shared preferences
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.2.7

  # Functional programming
  dartz: ^0.10.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Location
  geolocator: ^12.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Shimmer loading
  shimmer: ^3.0.0

  # URL launcher (WhatsApp, phone, maps)
  url_launcher: ^6.3.0

  # Permissions
  permission_handler: ^11.3.1

  # Date/time
  intl: ^0.20.2

  # Local notifications
  # Kept for FE-3: shows push notifications while the app is in the foreground.
  flutter_local_notifications: ^17.2.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Pin code fields (OTP)
  pinput: ^5.0.0

  # Cupertino icons

  # Crash reporting + funnel breadcrumbs (off unless SENTRY_DSN is set)
  sentry_flutter: ^8.14.2
  share_plus: ^12.0.2
  lucide_icons_flutter: ^3.1.20
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#2A1320'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    # Bundled so google_fonts never downloads at runtime (see main.dart).
    - assets/google_fonts/

  # Arabic fallbacks for the Latin families (AppTextStyles). Declared natively
  # so fontFamilyFallback resolves every weight without google_fonts.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/google_fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/google_fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Markazi Text
      fonts:
        - asset: assets/google_fonts/MarkaziText-Regular.ttf
        - asset: assets/google_fonts/MarkaziText-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/MarkaziText-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/MarkaziText-Bold.ttf
          weight: 700
