name: aiwa_app
description: AIWA - Beauty & Grooming Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network
  dio: ^5.4.3+1
  # ponytail: unused (0 imports in lib/), delete once no native plugin config needs it
  pretty_dio_logger: ^1.3.1

  # Dependency injection
  get_it: ^7.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Shared preferences
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.2.7

  # Functional programming
  dartz: ^0.10.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Location
  geolocator: ^12.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Shimmer loading
  shimmer: ^3.0.0

  # URL launcher (WhatsApp, phone, maps)
  url_launcher: ^6.3.0

  # Permissions
  permission_handler: ^11.3.1

  # Date/time
  intl: ^0.20.2

  # Local notifications
  # ponytail: unused (0 imports in lib/), delete once no native plugin config needs it
  flutter_local_notifications: ^17.2.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Pin code fields (OTP)
  pinput: ^5.0.0

  # Cupertino icons
  # ponytail: unused (0 imports in lib/), delete once no native plugin config needs it
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ponytail: unused (no @GenerateMocks in test/), delete or start using it
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#2A1320'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    # Bundled so google_fonts never downloads at runtime (see main.dart).
    - assets/google_fonts/
