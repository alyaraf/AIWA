# Production stack. The app is NOT published directly: put a TLS-terminating
# reverse proxy (nginx, Caddy, a cloud load balancer) in front of port 8080 on the
# internal network. SERVER forward headers are trusted from internal addresses only
# (server.forward-headers-strategy=native in the prod profile).
services:
  postgres:
    image: postgres:16-alpine
    container_name: aiwa_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - aiwa_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aiwa_redis_prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aiwa_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: aiwa_backend_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMS_PROVIDER: ${SMS_PROVIDER}
      SMS_API_URL: ${SMS_API_URL}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SENDER: ${SMS_SENDER}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev-log}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@aiwa.app}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-fcm}
      # Mounted read-only below; the file is the Firebase service-account JSON.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      SAFETY_ONCALL_PHONES: ${SAFETY_ONCALL_PHONES}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
    volumes:
      # Gallery photos, avatars and private ID documents survive redeploys.
      - aiwa_uploads_prod:/app/uploads
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  aiwa_pgdata_prod:
  aiwa_redisdata_prod:
  aiwa_uploads_prod:
