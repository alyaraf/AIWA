services:

  postgres:
    image: postgres:16-alpine
    container_name: aiwa_postgres
    environment:
      POSTGRES_DB: aiwa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aiwa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiwa_redis
    ports:
      - "6379:6379"
    volumes:
      - aiwa_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: aiwa_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiwa_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: aiwa-super-secret-key-change-in-production-2024
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  aiwa_pgdata:
  aiwa_redisdata:
