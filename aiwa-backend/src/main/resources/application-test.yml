spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

aiwa:
  terms:
    # Test contexts are shared, and some tests publish terms; a dedicated test turns
    # the AU-19 booking check on (OwnerRulesApiTest).
    enforce-on-booking: false
