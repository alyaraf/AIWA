spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # SA-15: Spring caches one context per distinct test configuration, and each used to keep a
      # 20-connection pool open. On a real PostgreSQL (max_connections 100) the suite ran out of
      # connections; small pools that hold no idle connections keep it well inside the limit.
      maximum-pool-size: 6
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: create-drop
    # F-08: the suite runs the way production does, so a lazy relation read outside a transaction fails here.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

aiwa:
  terms:
    # Test contexts are shared, and some tests publish terms; a dedicated test turns
    # the AU-19 booking check on (OwnerRulesApiTest).
    enforce-on-booking: false
