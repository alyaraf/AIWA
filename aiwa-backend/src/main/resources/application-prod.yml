server:
  # Trust X-Forwarded-For / -Proto from the reverse proxy (Tomcat's RemoteIpValve
  # only honours them from internal proxy addresses), so rate limiting keys on the
  # real client IP instead of the proxy's.
  forward-headers-strategy: native

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    # F-08: no database connection is held for the whole request. Lazy relations are mapped inside
    # transactions (the whole test suite runs with this off). Check on staging before launch.
    open-in-view: false
  flyway:
    enabled: true
    # RV-03: a rolled-back (older) image starts on a database a newer release already migrated: migrations it
    # doesn't know are skipped, not an error. Flyway's default, stated so a rollback never depends on it.
    ignore-migration-patterns: "*:future"

# API docs are a map of every endpoint — not public in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.aiwa: INFO
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: never

aiwa:
  auth:
    cookie-secure: true
    # E-1 / AU-09 (owner rule 2026-10-04): Super admin and Finance admins must turn on
    # two-factor sign-in before the admin API answers them (AdminTwoFactorInterceptor).
    require-admin-2fa: ${REQUIRE_ADMIN_2FA:true}
