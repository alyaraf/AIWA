# Local run profile — H2 in-memory + local Redis, no Docker required.
#   mvn -Plocal package
#   java -jar target/aiwa-backend-1.0.0.jar --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:mem:aiwa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    # keep the session open through view rendering for the demo (prod stays false)
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2

management:
  health:
    redis:
      enabled: false

aiwa:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000
  admin:
    email: admin@aiwa.com
    password: AdminPassword123!
    full-name: S. Mahmoud
