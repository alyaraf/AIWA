server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  # Behind a reverse proxy (nginx / a load balancer) the client IP arrives in
  # X-Forwarded-For. Overridden to "native" in the prod profile; left off here so
  # a directly-exposed dev server can't be fooled by a spoofed header.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: aiwa-backend
  profiles:
    default: dev

  # NOTE: these limits used to sit under server.servlet.multipart, which Spring
  # ignores — the effective limit was the 1 MB default, so ordinary phone photos
  # were rejected.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiwa_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty locally; required by deploy/docker-compose.prod.yml.
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Lazy relations on list pages (customer, provider, service, staff…)
        # load in batches of up to 50 instead of one query per row (BE-39).
        default_batch_fetch_size: 50
    # Several controllers map entities with lazy relations after the repository
    # call returns. Every manual and automated run so far used open-in-view=true
    # (the local profile); with it off, those endpoints throw
    # LazyInitializationException in production only. Keep the tested behaviour
    # until those mappings are moved into @Transactional services.
    open-in-view: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.aiwa: DEBUG
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:aiwa-super-secret-key-change-in-production-2024}
  # DR-002: short access tokens bound how long a revoked one works while Redis is down; clients refresh silently.
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  # Latency buckets for the SlowApi alert (deploy/monitoring/alerts.yml).
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# OPS-5: error tracking. Off until SENTRY_DSN is set; no personal data is sent.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: false
  traces-sample-rate: 0.0

aiwa:
  # Bearer token Prometheus sends to /actuator/prometheus; empty = endpoint hidden.
  metrics:
    token: ${METRICS_TOKEN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  default-radius-km: 10
  storage:
    public-path: ${STORAGE_PUBLIC_PATH:uploads/public}
    private-path: ${STORAGE_PRIVATE_PATH:uploads/private}
    # Public photos are re-encoded without EXIF/GPS; the longest side is capped at this many pixels.
    public-max-image-side: 2048
    # Public uploads declaring more than this many pixels (width x height) are refused with 400 before any decode:
    # 200 million pixels still admits the largest phone sensors (200 MP modes); nothing a phone takes is bigger.
    public-max-image-pixels: 200000000
  cancellation:
    cutoff-hours: 2
  booking:
    # CR-03: hours after a booking is completed in which the customer may report
    # "not paid" (once per booking). 0 = never.
    payment-dispute-window-hours: 48
    # CR-11: a venue customer can check in from this many minutes before the
    # start, until the slot ends.
    check-in-lead-minutes: 30
    # CR-13: an identical booking request sent again within this time, without an
    # Idempotency-Key, is a double tap and is answered with the first booking.
    auto-dedup-window: 10s
  terms:
    current-version: "1.0"
  auth:
    # Secure flag on the accessToken cookie. Must be true anywhere the API is
    # served over HTTPS (prod profile forces it on).
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # CR-01: sign-in attempts (wrong password or wrong 2FA code) an account gets
    # before it refuses sign-in with 429, and for how long. Counted in the database.
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-duration: ${AUTH_LOCKOUT_DURATION:15m}
    # Wrong codes one 2FA challenge survives; after that the user signs in again.
    mfa-max-wrong-codes: ${AUTH_MFA_MAX_WRONG_CODES:5}
  otp:
    # Per-phone send limits (SMS pumping / cost guard) on top of the per-IP limit.
    max-sends-per-10-minutes: ${OTP_MAX_SENDS_10M:3}
    max-sends-per-day: ${OTP_MAX_SENDS_DAY:10}
  settlement:
    # Owed commission (EGP) at which a provider's new bookings pause until settled.
    balance-limit: ${SETTLEMENT_BALANCE_LIMIT:1000}
    # Days after a ledger entry is created before it becomes OVERDUE.
    due-days: ${SETTLEMENT_DUE_DAYS:7}
  safety:
    # Comma-separated on-call support numbers texted on every SOS.
    oncall-phones: ${SAFETY_ONCALL_PHONES:}
    # CR-08: an SOS text that was not delivered is re-sent until the SOS is closed.
    sos-retry:
      # How often undelivered texts are looked for.
      sweep-interval-ms: ${SOS_RETRY_SWEEP_INTERVAL_MS:30000}
      # A text being sent right now is left alone by the sweep for this long.
      in-flight-grace: ${SOS_RETRY_IN_FLIGHT_GRACE:2m}
      # Wait after a failed round of 3 tries; doubles each round up to backoff-max.
      backoff: ${SOS_RETRY_BACKOFF:1m}
      backoff-max: ${SOS_RETRY_BACKOFF_MAX:15m}
  sms:
    provider: ${SMS_PROVIDER:dev-log}
    api-url: ${SMS_API_URL:}
    api-key: ${SMS_API_KEY:}
    sender: ${SMS_SENDER:AIWA}
  email:
    # dev-log | http — "http" posts JSON {from,to,subject,text} with a Bearer key
    # to EMAIL_API_URL (works with most transactional email gateways/relays).
    provider: ${EMAIL_PROVIDER:dev-log}
    api-url: ${EMAIL_API_URL:}
    api-key: ${EMAIL_API_KEY:}
    from: ${EMAIL_FROM:no-reply@aiwa.app}
  push:
    # dev-log | fcm (Firebase Cloud Messaging HTTP v1)
    provider: ${PUSH_PROVIDER:dev-log}
    # Path to the Firebase service-account JSON (the standard Google variable).
    fcm-credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:}
    # Optional; defaults to project_id inside the service-account JSON.
    fcm-project-id: ${FCM_PROJECT_ID:}
  admin:
    email: ${ADMIN_EMAIL:}
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:AIWA Admin}
