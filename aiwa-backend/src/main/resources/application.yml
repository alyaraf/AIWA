server:
  port: 8080
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

spring:
  application:
    name: aiwa-backend
  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiwa_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.aiwa: DEBUG
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:aiwa-super-secret-key-change-in-production-2024}
  expiration: 86400000
  refresh-expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

aiwa:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  maps:
    google-api-key: ${GOOGLE_MAPS_API_KEY:your-google-maps-key}
  default-radius-km: 10
  storage:
    public-path: uploads/public
    private-path: uploads/private
  cancellation:
    cutoff-hours: 2
  terms:
    current-version: "1.0"
  sms:
    provider: ${SMS_PROVIDER:dev-log}
    api-url: ${SMS_API_URL:}
    api-key: ${SMS_API_KEY:}
    sender: ${SMS_SENDER:AIWA}
  push:
    provider: ${PUSH_PROVIDER:dev-log}
    fcm-server-key: ${FCM_SERVER_KEY:}
  admin:
    email: ${ADMIN_EMAIL:}
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:AIWA Admin}
