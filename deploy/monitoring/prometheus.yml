# OPS-5: scraped inside the compose network only; Prometheus is not published.
# Look at it through an SSH tunnel: ssh -L 9090:localhost:9090 <server>, after
# adding "ports: [127.0.0.1:9090:9090]" if you want the UI.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# R2-04: firing alerts go to Alertmanager, which emails / messages the team.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aiwa-backend
    metrics_path: /api/actuator/prometheus
    authorization:
      type: Bearer
      # Same value as METRICS_TOKEN in deploy/.env.
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ["backend:8080"]

  # CR-20: the backup container serves its last-success timestamp (backup.sh).
  - job_name: aiwa-backup
    metrics_path: /metrics.txt
    static_configs:
      - targets: ["backup:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # F-02: the offsite service writes its last-success timestamp next to the backup metrics.
  - job_name: aiwa-offsite
    metrics_path: /offsite.txt
    static_configs:
      - targets: ["backup:9100"]

  # F-07: disk and memory of the host (node-exporter, mounted read-only).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
