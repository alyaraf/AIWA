# OPS-5 alert rules, delivered by Alertmanager (email / Telegram, set in deploy/.env;
# R2-04). An outside uptime check covers the whole server being down (docs/runbooks.md).
# The SOS text to the on-call phones does not depend on any of this.
groups:
  - name: aiwa
    rules:
      - alert: BackendDown
        expr: up{job="aiwa-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "AIWA backend is not answering the metrics scrape"

      - alert: SosRaised
        expr: increase(aiwa_sos_alerts_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "A customer or provider raised an SOS; open the admin Safety queue now"

      # DR-006: an SOS nobody has picked up in 10 minutes.
      - alert: SosUnanswered
        expr: aiwa_sos_open_oldest_age_seconds > 600
        labels: { severity: critical }
        annotations:
          summary: "An SOS has been open for more than 10 minutes; open the admin Safety queue"

      # CR-08: the SOS text to an on-call phone failed (the backend keeps retrying
      # until the SOS is closed; 20m spans the longest back-off between rounds).
      - alert: SosOnCallTextFailed
        expr: increase(aiwa_sos_oncall_text_failed_total[20m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "An SOS text to an on-call phone was not delivered; check the SMS gateway and open the admin Safety queue"

      # M-10 / C-1: the SMS gateway refused or failed texts (OTP sign-up codes and SOS).
      # A 2xx with an error body now counts as a failure, so this sees credit or key problems.
      - alert: SmsSendFailures
        expr: sum(increase(aiwa_sms_sent_total{result!="ok"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "More than 5 SMS sends failed in 15 minutes; check the SMS gateway (credit, key, sender ID)"

      # AU-11: pushes failing (credentials, FCM errors); "unregistered" is normal churn and excluded.
      - alert: PushSendFailures
        expr: sum(increase(aiwa_push_sent_total{result=~"error|rejected|credentials"}[30m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "More than 20 push notifications failed in 30 minutes; check the Firebase credentials and FCM status"

      # AU-11: many wrong passwords across accounts (credential stuffing) or a broken sign-in.
      - alert: SignInFailureSpike
        expr: sum(increase(aiwa_auth_login_total{result=~"bad_credentials|locked_out"}[15m])) > 100
        labels: { severity: warning }
        annotations:
          summary: "Over 100 failed sign-ins in 15 minutes; check for credential stuffing (audit log, rate-limit hits)"

      # H-4: the global OTP budget was hit; sign-up and password reset codes are refused
      # until the hour rolls over. Either real growth (raise OTP_MAX_GLOBAL_SENDS_*) or SMS pumping.
      - alert: OtpGlobalBudgetExhausted
        expr: increase(aiwa_otp_global_budget_exhausted_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "OTP texts hit the global budget; check aiwa_otp_sent_total for pumping before raising the limit"

      # S-07: Redis is unreachable for the rate limiters, which then count in-process (per
      # instance, weaker than Redis). Restore Redis; sign-in throttling is degraded until then.
      - alert: RateLimitRedisUnavailable
        expr: sum(increase(aiwa_ratelimit_redis_unavailable_total[5m])) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Rate limiting is running on the in-process fallback because Redis is unreachable; check the redis container"

      # CR-20: no optional setting needed. The timestamp only moves after a verified
      # backup, so a failed or missed night ages it; 93600 s = 26 h.
      - alert: BackupStale
        expr: time() - aiwa_backup_last_success_timestamp_seconds > 93600
        labels: { severity: critical }
        annotations:
          summary: "The last good backup is more than 26 hours old; run dc logs backup"

      # Never succeeded, or the backup container is down / not serving its metrics.
      - alert: BackupMetricsMissing
        expr: absent(aiwa_backup_last_success_timestamp_seconds)
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "No backup status: the backup container is down or has never completed a backup; run dc ps and dc logs backup"

      - alert: BackupNotEncrypted
        expr: aiwa_backup_encrypted == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Backups are stored unencrypted (ID documents included); mount the backup key (docs/runbooks.md)"

      - alert: AlertingPipelineDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager is down: alerts are not being delivered"

      - alert: HighServerErrorRate
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests fail with a 5xx"

      - alert: SlowApi
        expr: >
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile API latency above 2 s"

      - alert: HeapNearlyFull
        expr: >
          sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap above 90% for 10 minutes"

      # F-07: always firing. Alertmanager pings DEADMAN_WEBHOOK_URL with it every 5 minutes; the external
      # service alerts when the pings stop (Prometheus, Alertmanager or the whole server is down).
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Dead-man's switch: this alert always fires"

      # F-07: the host (database, uploads, backups and logs all share one disk) is running out of room.
      - alert: HostDiskLow
        expr: >
          min(node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Less than 15% disk space left on the server; prune old backups/logs or grow the disk"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Less than 10% of server memory is available"

      - alert: HostMetricsMissing
        expr: absent(node_filesystem_avail_bytes{mountpoint="/host"})
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No host metrics: node-exporter is down, so disk and memory alerts cannot fire"

      # F-07: requests queue for a database connection (open-in-view holds one for the whole request).
      - alert: DbPoolSaturated
        expr: max(hikaricp_connections_pending) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Requests are waiting for a database connection; check slow queries and the pool size (DB_POOL_SIZE)"

      - alert: DbPoolNearlyFull
        expr: max(hikaricp_connections_active) / max(hikaricp_connections_max) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 90% of the database connection pool is in use"

      # F-02: encrypted backups are copied to a private bucket by the offsite service (deploy/backup/offsite.sh).
      - alert: OffsiteBackupStale
        expr: time() - aiwa_offsite_last_success_timestamp_seconds > 93600
        labels: { severity: critical }
        annotations:
          summary: "The last verified off-server backup copy is more than 26 hours old; run dc logs offsite"

      - alert: OffsiteBackupMetricsMissing
        expr: absent(aiwa_offsite_last_success_timestamp_seconds)
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "No off-server backup status: the offsite container is down or has never completed a copy"

      # F-07: Redis is down (redis_exporter). OTP codes answer 503 and rate limits fall back to per-process counters.
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Redis is not answering: sign-up/reset codes fail with 503 and rate limiting is degraded; check the redis container"

      - alert: RedisMetricsMissing
        expr: absent(redis_up)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "No Redis metrics: redis-exporter is down, so a Redis outage would not alert"

      # F-06: more than 20% of completed bookings in 6 h were closed by the provider as "cash not collected"
      # (no commission is charged for those). Needs at least 10 completions to avoid noise.
      - alert: CashNotCollectedRateHigh
        expr: >
          sum(increase(aiwa_booking_completed_total{cash="not_collected"}[6h]))
          / clamp_min(sum(increase(aiwa_booking_completed_total[6h])), 1) > 0.2
          and sum(increase(aiwa_booking_completed_total[6h])) >= 10
        labels: { severity: warning }
        annotations:
          summary: "Over 20% of recent completed bookings were closed as cash not collected; review the disputes queue for commission avoidance"
