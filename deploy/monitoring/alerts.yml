# OPS-5 alert rules, delivered by Alertmanager (email / Telegram, set in deploy/.env;
# R2-04). An outside uptime check covers the whole server being down (docs/runbooks.md).
# The SOS text to the on-call phones does not depend on any of this.
groups:
  - name: aiwa
    rules:
      - alert: BackendDown
        expr: up{job="aiwa-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "AIWA backend is not answering the metrics scrape"

      - alert: SosRaised
        expr: increase(aiwa_sos_alerts_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "A customer or provider raised an SOS; open the admin Safety queue now"

      # DR-006: an SOS nobody has picked up in 10 minutes.
      - alert: SosUnanswered
        expr: aiwa_sos_open_oldest_age_seconds > 600
        labels: { severity: critical }
        annotations:
          summary: "An SOS has been open for more than 10 minutes; open the admin Safety queue"

      # CR-08: the SOS text to an on-call phone failed (the backend keeps retrying
      # until the SOS is closed; 20m spans the longest back-off between rounds).
      - alert: SosOnCallTextFailed
        expr: increase(aiwa_sos_oncall_text_failed_total[20m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "An SOS text to an on-call phone was not delivered; check the SMS gateway and open the admin Safety queue"

      # M-10 / C-1: the SMS gateway refused or failed texts (OTP sign-up codes and SOS).
      # A 2xx with an error body now counts as a failure, so this sees credit or key problems.
      - alert: SmsSendFailures
        expr: sum(increase(aiwa_sms_sent_total{result!="ok"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "More than 5 SMS sends failed in 15 minutes; check the SMS gateway (credit, key, sender ID)"

      # AU-11: pushes failing (credentials, FCM errors); "unregistered" is normal churn and excluded.
      - alert: PushSendFailures
        expr: sum(increase(aiwa_push_sent_total{result=~"error|rejected|credentials"}[30m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "More than 20 push notifications failed in 30 minutes; check the Firebase credentials and FCM status"

      # AU-11: many wrong passwords across accounts (credential stuffing) or a broken sign-in.
      - alert: SignInFailureSpike
        expr: sum(increase(aiwa_auth_login_total{result=~"bad_credentials|locked_out"}[15m])) > 100
        labels: { severity: warning }
        annotations:
          summary: "Over 100 failed sign-ins in 15 minutes; check for credential stuffing (audit log, rate-limit hits)"

      # H-4: the global OTP budget was hit; sign-up and password reset codes are refused
      # until the hour rolls over. Either real growth (raise OTP_MAX_GLOBAL_SENDS_*) or SMS pumping.
      - alert: OtpGlobalBudgetExhausted
        expr: increase(aiwa_otp_global_budget_exhausted_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "OTP texts hit the global budget; check aiwa_otp_sent_total for pumping before raising the limit"

      # CR-20: no optional setting needed. The timestamp only moves after a verified
      # backup, so a failed or missed night ages it; 93600 s = 26 h.
      - alert: BackupStale
        expr: time() - aiwa_backup_last_success_timestamp_seconds > 93600
        labels: { severity: critical }
        annotations:
          summary: "The last good backup is more than 26 hours old; run dc logs backup"

      # Never succeeded, or the backup container is down / not serving its metrics.
      - alert: BackupMetricsMissing
        expr: absent(aiwa_backup_last_success_timestamp_seconds)
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "No backup status: the backup container is down or has never completed a backup; run dc ps and dc logs backup"

      - alert: BackupNotEncrypted
        expr: aiwa_backup_encrypted == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Backups are stored unencrypted (ID documents included); mount the backup key (docs/runbooks.md)"

      - alert: AlertingPipelineDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager is down: alerts are not being delivered"

      - alert: HighServerErrorRate
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests fail with a 5xx"

      - alert: SlowApi
        expr: >
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile API latency above 2 s"

      - alert: HeapNearlyFull
        expr: >
          sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap above 90% for 10 minutes"
