# Production stack (BE-22 / OPS-2 / OPS-8). Only Caddy is reachable from the
# internet; it terminates TLS (automatic Let's Encrypt certificates) and proxies
# to the backend, the admin panel and the public legal site. See docs/release.md.
#   cp .env.example .env && RELEASE_TAG=$(git rev-parse --short HEAD) docker compose -f docker-compose.prod.yml up -d --build
# Every image is pinned to an exact version, and our own images are tagged with
# RELEASE_TAG (the git commit), so a rollback is "RELEASE_TAG=<previous> ... up -d
# --no-build" (R2-20, docs/release.md). Prometheus and Alertmanager always run:
# alerts reach the team set in .env (R2-04).
name: aiwa

# F-07: container logs rotate; without this the json-file driver grows until the disk is full.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      # F-19: networks allowed to reach the admin panel (space-separated CIDRs: office, VPN). Default: everyone.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
      # FE-13 link verification; empty until the stores exist (links then open the web page).
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy's admin API answers inside the container only.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend: { condition: service_healthy }
      admin: { condition: service_healthy }

  backend:
    build: ../aiwa-backend
    image: aiwa-backend:${RELEASE_TAG:-local}
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    logging: *default-logging
    # F-19: only the settings the backend reads. It used to get the whole .env (database admin
    # password for the backup, alert SMTP/Telegram secrets, ...). A bare "- NAME" passes the value
    # through from .env when it is set and leaves it unset otherwise, so application.yml defaults still apply.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/aiwa_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=https://${ADMIN_DOMAIN}
      # What FcmPushService reads; the file comes from ./secrets below.
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
      # S-02: the backend refuses to start without these (ProductionGuardConfig); compose fails first, with a clearer message.
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY (openssl rand -base64 32)}
      - DOCUMENT_ENCRYPTION_KEY=${DOCUMENT_ENCRYPTION_KEY:?Set DOCUMENT_ENCRYPTION_KEY (openssl rand -base64 32)}
      - DB_USERNAME
      - DB_PASSWORD
      - DB_POOL_SIZE
      - DB_POOL_TIMEOUT_MS
      - REDIS_PASSWORD
      - JWT_SECRET
      - JWT_EXPIRATION_MS
      - JWT_ADMIN_REFRESH_EXPIRATION_MS
      - METRICS_TOKEN
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SMS_PROVIDER
      - SMS_API_URL
      - SMS_API_KEY
      - SMS_SENDER
      - EMAIL_PROVIDER
      - EMAIL_API_URL
      - EMAIL_API_KEY
      - EMAIL_FROM
      - PUSH_PROVIDER
      - FCM_PROJECT_ID
      - SAFETY_ONCALL_PHONES
      - ADMIN_EMAIL
      - ADMIN_PHONE
      - ADMIN_PASSWORD
      - ADMIN_FULL_NAME
      - OTP_ALLOWED_COUNTRY_CODES
      - OTP_MAX_SENDS_10M
      - OTP_MAX_SENDS_DAY
      - OTP_MAX_GLOBAL_SENDS_HOUR
      - OTP_MAX_GLOBAL_SENDS_DAY
      - AUTH_MAX_FAILED_ATTEMPTS
      - AUTH_LOCKOUT_DURATION
      - AUTH_MFA_MAX_WRONG_CODES
      - REQUIRE_ADMIN_2FA
      - BOOKING_MAX_OPEN_REQUESTS
      - SETTLEMENT_BALANCE_LIMIT
      - SETTLEMENT_DUE_DAYS
      - SOS_RETRY_SWEEP_INTERVAL_MS
      - SOS_RETRY_IN_FLIGHT_GRACE
      - SOS_RETRY_BACKOFF
      - SOS_RETRY_BACKOFF_MAX
      - PUBLIC_MAX_PROGRESSIVE_PIXELS
      - NOTIFICATION_RETENTION_DAYS
    volumes:
      - uploads:/app/uploads
      - ./secrets:/run/secrets:ro   # firebase-service-account.json (git-ignored)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  admin:
    build:
      context: ../aiwa-admin-dashboard-updated
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}/api
    image: aiwa-admin:${RELEASE_TAG:-local}
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    environment:
      API_ORIGIN: https://${API_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiwa_db}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OPS-2: nightly pg_dump + uploads tarball into ./backups (git-ignored), kept
  # BACKUP_KEEP_DAYS. The offsite service below copies them off the server.
  backup:
    build: ./backup   # F-02: postgres image with openssl baked in (no "apk add" at run time)
    image: aiwa-backup:${RELEASE_TAG:-local}
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-aiwa_db}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # R2-02: pinged after each verified backup; a missing ping alerts (healthchecks.io etc.).
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # CR-20 / S-02: the dump and the uploads tarball are encrypted with the host key file below
      # (BACKUP_KEY_FILE in .env, docs/runbooks.md). It is required: without it backup.sh refuses to
      # write an unencrypted backup.
      BACKUP_KEY_FILE: /run/secrets/backup.key
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ${BACKUP_KEY_FILE:?Set BACKUP_KEY_FILE (docs/runbooks.md)}:/run/secrets/backup.key:ro
      - ./backups:/backups
      - uploads:/uploads
    healthcheck:
      # Unhealthy when the last verified backup is more than 26 hours old.
      test: ["CMD-SHELL", "test -n \"$$(find /backups/last-success -mmin -1560 2>/dev/null)\""]
      interval: 10m
      start_period: 2h
    depends_on:
      postgres: { condition: service_healthy }

  # F-02: copies the encrypted backups to a private bucket (rclone copy --immutable, never sync) and
  # proves the copy; alerts OffsiteBackupStale / OffsiteBackupMetricsMissing. Required: a server-only
  # backup does not survive losing the server. Setup: docs/runbooks.md "Backups off the server".
  offsite:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    entrypoint: ["sh", "/offsite.sh"]
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:?Set OFFSITE_REMOTE (rclone remote:bucket/path, docs/runbooks.md)}
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-21600}
      OFFSITE_HEARTBEAT_URL: ${OFFSITE_HEARTBEAT_URL:-}
    volumes:
      - ./backup/offsite.sh:/offsite.sh:ro
      - ./secrets/rclone.conf:/config/rclone.conf:ro
      - ./backups:/backups
    depends_on: [backup]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics-token:/run/secrets/metrics-token:ro
      - prometheus_data:/prometheus
    depends_on: [backend, alertmanager]

  # F-07: host disk and memory. The server runs the database, uploads, backups and logs on one disk,
  # so a full disk is the most likely outage; HostDiskLow warns first.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)"]
    volumes:
      - /:/host:ro,rslave

  # R2-04: delivers the alerts (email and/or Telegram from .env). Refuses to
  # start without a receiver, so missing alert settings are visible.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    entrypoint: ["sh", "/alertmanager-entrypoint.sh"]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      # F-07: dead-man's switch ping URL (healthchecks.io, Better Stack); empty = switch off.
      DEADMAN_WEBHOOK_URL: ${DEADMAN_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager-entrypoint.sh:/alertmanager-entrypoint.sh:ro
      - alertmanager_data:/alertmanager

  # F-07: lets Prometheus see Redis go down (RedisDown alert).
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  uploads:
  prometheus_data:
  alertmanager_data:
