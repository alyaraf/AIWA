# F-18: static analysis of the backend (Java) and the admin panel (JavaScript). Results appear under Security -> Code
# scanning. Add trivy/gitleaks as needed.
#
# A24-04: this is a REUSABLE workflow, called by the "codeql" job of ci.yml and required by release-gate, so a deployment
# waits for a successful analysis of the exact commit it deploys. It has no push / pull_request / schedule trigger of its
# own: ci.yml already runs on push to main, on pull requests (diff-only results) and weekly, and calls it every time.
# Run it by hand with workflow_dispatch (full scan of any branch).
name: CodeQL

on:
  workflow_call:
    outputs:
      scanned_sha:
        description: The commit that was checked out and analysed; release-gate compares it with the commit being released.
        value: ${{ jobs.commit.outputs.sha }}
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the CodeQL action reads its own workflow run; required in private repos
  security-events: write

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record the analysed commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$sha" != "$GITHUB_SHA" ]; then echo "::error::checked out $sha, expected $GITHUB_SHA"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  analyze:
    needs: [commit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: aiwa-backend
        run: mvn -B -q -DskipTests package
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload so Security -> Code scanning matches this run: alerts a later scan no longer finds
          # are closed there. The SARIF is also kept as an artifact and gated on below.
          upload: always
          output: sarif-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
      - name: Fail on any CodeQL result
        run: |
          n=$(jq -s '[.[].runs[].results[]] | length' sarif-results/*.sarif)
          echo "CodeQL results: $n"
          if [ "$n" -gt 0 ]; then
            jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' sarif-results/*.sarif
            exit 1
          fi
