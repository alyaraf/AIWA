# F-18: static analysis of the backend (Java) and the admin panel (JavaScript) on every push, pull
# request and weekly. Results appear under Security -> Code scanning. Add trivy/gitleaks as needed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: aiwa-backend
        run: mvn -B -q -DskipTests package
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
