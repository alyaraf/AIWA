# F-18: static analysis of the backend (Java) and the admin panel (JavaScript) on every push, pull
# request and weekly. Results appear under Security -> Code scanning. Add trivy/gitleaks as needed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  actions: read   # the CodeQL action reads its own workflow run; required in private repos
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: aiwa-backend
        run: mvn -B -q -DskipTests package
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Code scanning (GitHub Code Security) is not enabled on this private repo, so the upload
          # would fail. Keep the SARIF as an artifact and gate on it here instead.
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
      - name: Fail on any CodeQL result
        run: |
          n=$(jq -s '[.[].runs[].results[]] | length' sarif-results/*.sarif)
          echo "CodeQL results: $n"
          if [ "$n" -gt 0 ]; then
            jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' sarif-results/*.sarif
            exit 1
          fi
