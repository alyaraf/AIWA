# F-18: static analysis of the backend (Java) and the admin panel (JavaScript) on every push, pull
# request and weekly. Results appear under Security -> Code scanning. Add trivy/gitleaks as needed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Build the backend
        if: matrix.language == 'java-kotlin'
        working-directory: aiwa-backend
        run: mvn -B -q -DskipTests package
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
