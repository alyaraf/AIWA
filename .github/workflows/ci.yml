# OPS-6 / OPS-8: every push and PR runs the backend tests, the migrations on a
# real PostgreSQL 16, the admin panel tests + build, and Flutter analyze + test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # S-09: the dependency CVE scan also runs weekly, because new advisories appear without new commits.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiwa-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiwa_db
          POSTGRES_USER: aiwa
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiwa" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and API tests (H2)
        run: mvn -B test
      # BE-23: the same suite on real PostgreSQL 16 + Redis, with the Flyway
      # migrations and ddl-auto=validate. MigrationSchemaValidationTest is the
      # H2-only migration check, so it is left out here.
      - name: Unit and API tests on PostgreSQL 16 (BE-23)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aiwa_db
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: aiwa
          SPRING_DATASOURCE_PASSWORD: ci-only-password
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_FLYWAY_ENABLED: "true"
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
        run: mvn -B test '-Dtest=!MigrationSchemaValidationTest'
      - name: Migrations + schema validation on PostgreSQL 16 (BE-31)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aiwa_db
          DB_USERNAME: aiwa
          DB_PASSWORD: ci-only-password
          FLYWAY_ENABLED: "true"
          JPA_DDL_AUTO: validate
          JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-hs256-signing-0123456789
          # F-01: the S-01 guard applies to every profile but local/test, so this boot uses the
          # hardened settings (well-formed dummy keys and providers, never real secrets).
          SPRING_PROFILES_ACTIVE: prod
          SMS_PROVIDER: external
          SMS_API_URL: https://sms.example.invalid/send
          SMS_API_KEY: ci-only
          EMAIL_PROVIDER: http
          EMAIL_API_URL: https://mail.example.invalid/send
          EMAIL_API_KEY: ci-only
          PUSH_PROVIDER: fcm
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ci-firebase.json
          SAFETY_ONCALL_PHONES: "+201000000000"
          TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          DOCUMENT_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
        run: |
          echo "{}" > /tmp/ci-firebase.json
          mvn -B -q package -DskipTests
          java -jar target/*.jar > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/actuator/health >/dev/null; then echo "started"; exit 0; fi
            sleep 2
          done
          cat app.log; exit 1
      - name: Docker image builds
        run: docker build -q -t aiwa-backend:ci .

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiwa-admin-dashboard-updated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aiwa-admin-dashboard-updated/package-lock.json
      - run: npm ci --ignore-scripts   # F-18: no install scripts from dependencies
      # AU-11: known high/critical advisories in what ships to the browser fail the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api

  # I-01: the Prometheus alert rules are checked and unit-tested with promtool, using the label shape
  # node-exporter really emits (mountpoint "/" under --path.rootfs=/host).
  monitoring-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool check rules and unit tests
        working-directory: deploy/monitoring
        run: |
          PROM=prom/prometheus:v2.54.1   # keep equal to the image in deploy/docker-compose.prod.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool "$PROM" check rules alerts.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool "$PROM" test rules alerts_test.yml

  # I-02 / I-03: the backup, staged-restore and failure-injection suites (no containers needed except the
  # real-PostgreSQL restore test).
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash deploy/backup/backup_test.sh
      - run: bash deploy/backup/uploads_swap_test.sh
      - run: bash deploy/restore_flow_test.sh
      - run: bash deploy/restore_test.sh

  # Roadmap P3 (dependency governance): a software bill of materials for what ships, kept as a build artifact so a
  # newly published advisory can be matched against the exact versions of every release. The Flutter lock file
  # (Android/aiwa_app/pubspec.lock) is the mobile inventory.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Backend SBOM (CycloneDX)
        working-directory: aiwa-backend
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=sbom-backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Admin SBOM (CycloneDX, production dependencies)
        working-directory: aiwa-admin-dashboard-updated
        run: |
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx --omit dev > sbom-admin.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            aiwa-backend/target/sbom-backend.json
            aiwa-admin-dashboard-updated/sbom-admin.json

  flutter:
    # The golden screenshots (test/goldens) are recorded on Windows; text
    # anti-aliasing differs on Linux, so this job runs where they were made.
    # Pinned so a new Flutter release can't shift the goldens silently.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Android/aiwa_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # SA-05: Dart tests never read AndroidManifest.xml or the Gradle build, so an invalid manifest
  # shipped with every test green. This job builds the debug APK.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android/aiwa_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      # S-08: a release build must refuse a missing or non-HTTPS API_BASE_URL (checkReleaseConfig in
      # android/app/build.gradle.kts). Both attempts must fail, and for that reason.
      - name: Release build refuses a missing or non-HTTPS API_BASE_URL
        shell: bash
        run: |
          for define in "" "--dart-define=API_BASE_URL=http://insecure.example/api"; do
            if flutter build apk --release $define > release-guard.log 2>&1; then
              echo "::error::a release build without a valid https API_BASE_URL must fail"; exit 1
            fi
            grep -q "API_BASE_URL must be an https" release-guard.log || { cat release-guard.log; echo "::error::the release build failed for the wrong reason"; exit 1; }
          done

  # S-09: backend dependency CVE scan (OWASP Dependency-Check). Needs the repository secret NVD_API_KEY
  # (free, https://nvd.nist.gov/developers/request-an-api-key): without it the NVD feed download takes
  # hours, so the job warns and skips instead of hanging. Fails on any CVSS >= 7; the HTML/JSON reports
  # are kept as a build artifact. Dependabot (.github/dependabot.yml) covers advisories without the key.
  dependency-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # R4-08: "skipped" must not look like "scanned". The job is green either way, but it says which one happened in
    # this output, in its summary, and release-gate passes it on (and can refuse a skipped scan, see there).
    outputs:
      scan: ${{ steps.scan.outputs.status }}
    defaults:
      run:
        working-directory: aiwa-backend
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: OWASP Dependency-Check
        id: scan
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "status=skipped" >> "$GITHUB_OUTPUT"
              echo "::warning::NVD_API_KEY is not set: the backend CVE scan was SKIPPED, not passed (see docs/release.md)"
              echo "### Backend CVE scan: SKIPPED (no NVD_API_KEY). This is not a passing scan." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::NVD_API_KEY is not set: the scheduled/manual CVE scan cannot run (F-18)"; exit 1
          fi
          mvn -B -ntp -DskipTests org.owasp:dependency-check-maven:12.1.8:check             -DnvdApiKey="$NVD_API_KEY" -Dformat=ALL -DfailBuildOnCVSS=7 -DskipTestScope=true
          echo "status=ran" >> "$GITHUB_OUTPUT"
          echo "### Backend CVE scan: ran, no CVSS >= 7 finding" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-check-report
          path: aiwa-backend/target/dependency-check-report.*
          if-no-files-found: ignore

  # R4-08: the one gate every deployment / promotion waits for. It needs EVERY validation job (including the new
  # recovery, monitoring, mobile and SBOM jobs) and requires each to have really succeeded: a failed, cancelled or
  # skipped job fails the gate (needs.*.result). Run with always() so it reports instead of being silently skipped.
  # The CVE scan reports whether it RAN; set the repository variable REQUIRE_CVE_SCAN=true to make a skipped scan
  # fail the gate (use it for production promotion). Checked by .github/scripts/check-ci-graph.mjs (job "ci-graph").
  release-gate:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-graph, backend, admin, monitoring-rules, backup-restore, sbom, flutter, android, dependency-scan]
    runs-on: ubuntu-latest
    outputs:
      security_scan: ${{ needs.dependency-scan.outputs.scan }}
    steps:
      - name: Require every release check
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRE_CVE_SCAN: ${{ vars.REQUIRE_CVE_SCAN }}
        run: |
          failed=0
          for job in ci-graph backend admin monitoring-rules backup-restore sbom flutter android dependency-scan; do
            result=$(echo "$NEEDS" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            [ "$result" = success ] || failed=1
          done
          scan=$(echo "$NEEDS" | jq -r '.["dependency-scan"].outputs.scan // "unknown"')
          echo "backend CVE scan: $scan"
          echo "| backend CVE scan | $scan |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$scan" != ran ]; then
            echo "::warning::the backend CVE scan did not run ($scan): this release has no vulnerability scan evidence"
            if [ "$REQUIRE_CVE_SCAN" = true ]; then echo "::error::REQUIRE_CVE_SCAN=true and the scan did not run"; failed=1; fi
          fi
          [ "$failed" -eq 0 ]

  # R4-08: verifies this file's dependency graph (deploy-staging depends, transitively, on every required job).
  ci-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node .github/scripts/check-ci-graph.mjs --self-test

  # OPS-6: deploy main to staging once EVERY validation job is green (release-gate, R4-08). Inactive
  # until the repo has the variables STAGING_HOST, STAGING_USER, STAGING_API_DOMAIN
  # and the secrets STAGING_SSH_KEY, STAGING_KNOWN_HOSTS (docs/release.md).
  deploy-staging:
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ vars.STAGING_HOST }}
          USER_NAME: ${{ vars.STAGING_USER }}
          SHA: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server holds a deploy-only checkout at /srv/aiwa with its own deploy/.env.
          # $SHA is meant to expand here, on the runner.
          # shellcheck disable=SC2029
          ssh "$USER_NAME@$HOST" "set -e; cd /srv/aiwa && git fetch --quiet origin && git checkout --quiet --detach $SHA && cd deploy && RELEASE_TAG=$SHA docker compose -f docker-compose.prod.yml up -d --build --remove-orphans"
      - name: Health check
        env:
          API_DOMAIN: ${{ vars.STAGING_API_DOMAIN }}
        run: curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "https://$API_DOMAIN/api/actuator/health"
