# OPS-6 / OPS-8: every push and PR runs the backend tests, the migrations on a
# real PostgreSQL 16, the admin panel tests + build, and Flutter analyze + test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiwa-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiwa_db
          POSTGRES_USER: aiwa
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiwa" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and API tests
        run: mvn -B test
      - name: Migrations + schema validation on PostgreSQL 16 (BE-31)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aiwa_db
          DB_USERNAME: aiwa
          DB_PASSWORD: ci-only-password
          FLYWAY_ENABLED: "true"
          JPA_DDL_AUTO: validate
          JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-hs256-signing-0123456789
        run: |
          mvn -B -q package -DskipTests
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/actuator/health >/dev/null; then echo "started"; exit 0; fi
            sleep 2
          done
          cat app.log; exit 1
      - name: Docker image builds
        run: docker build -q -t aiwa-backend:ci .

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiwa-admin-dashboard-updated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aiwa-admin-dashboard-updated/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android/aiwa_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Goldens are platform-specific; regenerate on Linux once, then enforce.
      - run: flutter test
